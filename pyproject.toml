[project]
name = "atomllm"
version = "0.1.0"
description = "A from-scratch 300M language model training and deployment project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets>=5.0.0",
    "numpy>=2.5.0",
    "opencc-python-reimplemented>=0.1.7",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "tensorboard>=2.20.0",
    "tokenizers>=0.23.1",
    "torch==2.11.0",
]

[project.scripts]
atomllm-acquire-wikipedia = "atomllm.data.acquisition:main"
atomllm-clean-wikipedia = "atomllm.data.cleaning:main"
atomllm-deduplicate-wikipedia = "atomllm.data.deduplication:main"
atomllm-split-wikipedia = "atomllm.data.splitting:main"
atomllm-build-data-version = "atomllm.data.versioning:main"
atomllm-validate-formal-data-plan = "atomllm.data.formal_plan:main"
atomllm-acquire-formal-v0 = "atomllm.data.formal_acquisition:main"
atomllm-process-formal-v0 = "atomllm.data.formal_processing:main"
atomllm-audit-formal-v0 = "atomllm.data.formal_audit:main"
atomllm-acquire-formal-70g-space = "atomllm.data.formal_space:main"
atomllm-download-post-training-data = "atomllm.post_training.data_download:main"
atomllm-train-tokenizer = "atomllm.tokenizer.training:main"
atomllm-evaluate-tokenizer = "atomllm.tokenizer.evaluation:main"
atomllm-audit-tokenizer-smoke = "atomllm.tokenizer.audit:main"
atomllm-count-model-parameters = "atomllm.model.config:main"
atomllm-accept-micro-model = "atomllm.training.micro_acceptance:main"
atomllm-validate-training-plan = "atomllm.training.config:main"
atomllm-pack-training-data = "atomllm.training.packing:main"
atomllm-train = "atomllm.training.trainer:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/devdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.uv.sources]
torch = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
