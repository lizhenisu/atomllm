[project]
name = "atomllm"
version = "0.1.0"
description = "A from-scratch 300M language model training and deployment project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datasets>=5.0.0",
    "numpy>=2.5.0",
    "opencc-python-reimplemented>=0.1.7",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "torch",
]

[project.scripts]
atomllm-acquire-wikipedia = "atomllm.data.acquisition:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/devdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
